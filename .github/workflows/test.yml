name: Corre Tests en pull request

on:
  pull_request:
    branches: ["master"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instala dependencias
        run: |
          rm -f package-lock.json
          npm install
          npm rebuild

      - name: Corre tests
        run: npm test
